name: Yayini Guncelle

on:
  schedule:
    - cron: '*/5 * * * *' # Her 5 dakikada bir çalıştırır
  workflow_dispatch: # Manuel tetikleme butonu ekler

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v3

      - name: Python'u Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle ve Scripti Çalıştır
        run: |
          pip install -r requirements.txt
          python scraper.py

      - name: Yeni Linki GitHub'a Kaydet (Push)
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@example.com"
          git add ceydus2.m3u8
          git commit -m "Yayini guncelle" || exit 0
          git push
